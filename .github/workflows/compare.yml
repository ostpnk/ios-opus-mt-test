name: compare

# Scores the published Mozilla and OPUS-MT models on the same sentences
# where both cover a direction (catalog/compare.py) and uploads compare.json
# as an artifact. Publishes nothing.
on:
  push:
    branches: [main]
    paths:
      - 'catalog/compare.py'
      - '.github/workflows/compare.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MOZILLA_RELEASE: https://github.com/ostpnk/translate-engine/releases/download/models-2026-10-27
  OPUS_RELEASE: https://github.com/ostpnk/translate-engine/releases/download/opus-2026-10-27b

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          # numpy/yaml: compare.py reuses opus_bundles helpers, whose
          # module imports them.
          sudo apt-get install -y ninja-build python3-numpy python3-yaml
      - name: Fetch engine
        run: build/fetch-engine.sh
      - name: Build Linux (libbergamot)
        run: build/build.sh linux
      - name: Compare
        run: |
          python3 -I catalog/compare.py --out out-compare \
            --library out/linux/lib/libbergamot.so \
            --mozilla-release "$MOZILLA_RELEASE" --opus-release "$OPUS_RELEASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare
          path: out-compare/compare.json
          if-no-files-found: ignore
