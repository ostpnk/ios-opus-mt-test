name: opus

# An opus-* tag converts every OPUS-MT direction in catalog/opus_directions.txt
# for Bergamot (catalog/opus_bundles.py: re-index, int8, quality gate) and
# publishes the bundles, catalog.json, qa.json and SHA256SUMS as a release.
# A push touching the OPUS scripts converts only ita-eng and publishes
# nothing.
on:
  push:
    branches: [main]
    paths:
      - 'catalog/opus_*'
      - 'catalog/bt.py'
      - '.github/workflows/opus.yml'
    tags: ['opus-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          # numpy/yaml from apt, not pip --user: the scripts run with
          # python3 -I, which ignores user site-packages.
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy python3-yaml
      - name: Fetch engine
        run: build/fetch-engine.sh
      - name: Build Linux (libbergamot, marian-conv)
        run: build/build.sh linux
      - name: Convert
        run: |
          if [[ "$GITHUB_REF" == refs/tags/opus-* ]]; then
            only=()
          else
            only=(--only ita-eng)
          fi
          python3 -I catalog/opus_bundles.py --out out-opus \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --library out/linux/lib/libbergamot.so \
            --marian-conv out/linux/bin/marian-conv \
            "${only[@]}"
          cat out-opus/qa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-catalog
          path: |
            out-opus/catalog.json
            out-opus/qa.json
            out-opus/SHA256SUMS
          if-no-files-found: ignore
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/opus-')
        env:
          GH_TOKEN: ${{ github.token }}
        # Create first, then upload: creating with the files in one go
        # failed at the very end once ("tag_name already exists", HTTP 422)
        # though every file had uploaded.
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "OPUS-MT models $GITHUB_REF_NAME" \
            --notes "OPUS-MT models from Helsinki-NLP's Tatoeba releases (CC BY 4.0 — credit Helsinki-NLP / OPUS-MT), converted for Bergamot: re-indexed to SentencePiece numbering and quantized to int8. Each passed a quality gate against the original model on the release's own test sentences (qa.json). catalog.json lists them for core_translate_model."
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            out-opus/bundles/* out-opus/catalog.json out-opus/qa.json out-opus/SHA256SUMS
