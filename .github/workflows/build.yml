name: build

# Every push to main, plus manual runs. The repo is public, so runner
# minutes are free; every run builds Marian from scratch.
on:
  push:
    branches: [main]
    # An engine-v* tag also publishes the stripped libraries as a release
    # (the `release` job), which core_translate_bergamot's build hook pins.
    tags: ['engine-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    # Apple Silicon: builds macOS (and tests it natively), iOS device and
    # iOS simulator, then tries the simulator build inside a simulator.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja
      - name: Fetch engine
        run: build/fetch-engine.sh
      - name: Build macOS
        run: build/build.sh macos
      - name: Test macOS
        run: build/smoke-test.sh out/macos
      - name: Build iOS (device)
        run: build/build.sh ios
      - name: Build iOS (simulator)
        run: build/build.sh ios-sim
      - name: Test in the iOS simulator
        # Best effort: whether `simctl spawn` forwards stdin to a command-
        # line binary is exactly what this finds out.
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          build/smoke-test.sh out/ios-sim xcrun simctl spawn "$udid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple
          path: out/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Fetch engine
        run: build/fetch-engine.sh
      - name: Build Linux
        run: build/build.sh linux
      - name: Test Linux
        run: build/smoke-test.sh out/linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux
          path: out/
          if-no-files-found: ignore

  android:
    # Build only: there's no arm64 device here. The binary is tested on a
    # phone over adb.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Fetch engine
        run: build/fetch-engine.sh
      - name: Build Android (arm64-v8a)
        run: build/build.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: out/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: [apple, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/*/*/release/* release/
          cp capi/bergamot_c.h release/
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
          ls -l release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "libbergamot $GITHUB_REF_NAME" \
            --notes "Stripped libbergamot builds (C interface: bergamot_c.h) from $(git rev-parse --short HEAD), engine mozilla/translations@$(grep -m1 -oE '[0-9a-f]{40}' build/fetch-engine.sh | cut -c1-8). Checksums in SHA256SUMS."
